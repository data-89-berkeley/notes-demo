name: Accessibility Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Accessibility Checks
        uses: berkeley-cdss/myst-a11y@v1
        with:
          base_url: '/${{ github.event.repository.name }}'
          # .myst-footer-link: the theme's Previous/Next links are labelled
          # "Previous: <title>" but show "<part> <title>", so axe's
          # label-content-name-mismatch rule can flag them on any page.
          exclude: "iframe[src*='youtube.com'], #movie_player, .myst-footer-link"
